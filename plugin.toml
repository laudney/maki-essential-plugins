min_maki_version = "0.6.5"
# The provider slugs this package registers, so it owns them and receives
# their saved keys instead of the generic models.dev client.
providers = ["runinfra", "fireworks-ai"]

[permissions]
agent = true
fs_read = true
fs_write = true
run = true
net = true
env = true
session_read = true
session_write = true
session_settings = true
net_hosts = ["api.runinfra.ai", "api.fireworks.ai"]
